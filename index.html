<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에코릭스 ECORIX</title>
<meta name="description" content="대기오염방지설비의 검토부터 운전 분석, 유지보수까지 맡는 환경엔지니어링 회사">
<meta property="og:title" content="에코릭스 ECORIX">
<meta property="og:description" content="대기오염방지설비의 검토부터 운전 분석, 유지보수까지 맡는 환경엔지니어링 회사">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.ecorix.co.kr/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #1C8CF2;   /* 주조색 (CI 확정) */
    --sub: #27AE60;    /* 보조색 에코그린 (CI 확정) */
    --tint: #EAF5FF;   /* 배경 틴트 */
    --txt: #191f28;
    --txt2: #4e5968;
    --txt3: #8b95a1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 16px 32px;
    background: linear-gradient(180deg, #fff 0%, var(--tint) 100%);
    color: var(--txt);
    font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    text-align: center;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 560px; }
  .wordmark {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--main);
    line-height: 1;
  }
  .name-ko {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.3em;
    color: var(--txt2);
  }
  .slogan {
    display: inline-block;
    margin-top: 28px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--sub);
    font-size: 18px;
    font-weight: 500;
    color: var(--sub);
  }
  .intro {
    margin-top: 28px;
    font-size: 17px;
    line-height: 1.7;
    color: var(--txt);
  }
  .notice {
    display: inline-block;
    margin-top: 40px;
    padding: 12px 28px;
    border-radius: 999px;
    background: var(--main);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
  }
  .contact {
    margin-top: 44px;
    font-size: 15px;
    color: var(--txt2);
  }
  .contact a {
    display: inline-block;
    margin-top: 8px;
    font-size: 17px;
    font-weight: 500;
    color: var(--main);
    text-decoration: none;
  }
  .contact a:hover { text-decoration: underline; }
  footer {
    margin-top: 64px;
    font-size: 12px;
    color: var(--txt3);
  }
  @media (max-width: 480px) {
    .wordmark { font-size: 36px; }
    .intro { font-size: 16px; }
  }
</style>
</head>
<body>
<main>
  <div class="wordmark">ECORIX</div>
  <div class="name-ko">에코릭스</div>
  <div class="slogan">환경을 지키는 기술</div>
  <p class="intro">대기오염방지설비의 검토부터 운전 분석,<br>유지보수까지 맡는 환경엔지니어링 회사</p>
  <div class="notice">홈페이지 준비중입니다</div>
  <div class="contact">
    설비에 관한 고민, 편하게 연락 주십시오<br>
    <a href="mailto:ecorix@ecorix.co.kr">ecorix@ecorix.co.kr</a>
  </div>
</main>
<footer>© 2026 에코릭스 ECORIX</footer>
</body>
</html>
