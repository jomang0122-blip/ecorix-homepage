<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에코릭스 ECORIX</title>
<meta name="description" content="대기환경 설비의 설계·시공·컨설팅부터 운전 데이터 분석·유지보수까지 함께하는 환경엔지니어링 회사">
<meta property="og:title" content="에코릭스 ECORIX">
<meta property="og:description" content="대기환경 설비의 설계·시공·컨설팅부터 운전 데이터 분석·유지보수까지 함께하는 환경엔지니어링 회사">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.ecorix.co.kr/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* v3 (2026-10-26): 화면 가운데 배치, 운전 데이터 분석 추가. v2: 한글 상호 크게, 사업 분야 크게, 준비중 표시 유지 */
  :root {
    --main: #1C8CF2;   /* 주조색 (CI 확정) */
    --sub: #27AE60;    /* 보조색 에코그린 (CI 확정) */
    --tint: #EAF5FF;   /* 배경 틴트 */
    --txt: #191f28;
    --txt2: #4e5968;
    --txt3: #8b95a1;
    --line: #dbe7f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 48px 16px 28px;
    background: linear-gradient(180deg, #fff 0%, var(--tint) 100%);
    color: var(--txt);
    font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 760px; margin: auto; }   /* 위아래 가운데 */
  .hero { text-align: center; }
  .brand { display: flex; justify-content: center; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .wordmark { font-size: 40px; font-weight: 700; letter-spacing: 0.08em; color: var(--main); line-height: 1; }
  .name-ko { font-size: 34px; font-weight: 700; letter-spacing: 0.06em; color: var(--txt); line-height: 1; }
  .slogan {
    display: inline-block; margin-top: 26px; padding-bottom: 6px;
    border-bottom: 2px solid var(--sub); font-size: 18px; font-weight: 500; color: var(--sub);
  }
  .intro { margin-top: 24px; font-size: 17px; line-height: 1.7; color: var(--txt); }
  h2 { font-size: 15px; font-weight: 700; color: var(--main); letter-spacing: 0.04em; margin-bottom: 14px; }
  .fields { margin-top: 48px; text-align: center; }
  .fields h2 { color: var(--sub); }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .chips span {
    padding: 10px 24px; border-radius: 999px; background: #fff;
    border: 1.5px solid var(--main); color: var(--main); font-size: 17px; font-weight: 700;
  }
  .notice-wrap { margin-top: 40px; text-align: center; }
  .notice { display: inline-block; padding: 8px 22px; border-radius: 999px; background: var(--tint); color: var(--main); font-size: 14px; font-weight: 500; }
  .contact { margin-top: 48px; text-align: center; }
  .contact p { font-size: 15px; color: var(--txt2); }
  .contact .lines { margin-top: 12px; display: flex; justify-content: center; gap: 10px 28px; flex-wrap: wrap; }
  .contact a { font-size: 17px; font-weight: 500; color: var(--main); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  footer {
    margin: 56px auto 0; width: 100%; max-width: 720px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12px; line-height: 1.8; color: var(--txt3); text-align: center;
  }
  @media (max-width: 520px) {
    .wordmark { font-size: 32px; }
    .name-ko { font-size: 28px; }
    .intro { font-size: 16px; }
    
  }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="brand"><span class="wordmark">ECORIX</span><span class="name-ko">에코릭스</span></div>
    <div class="slogan">환경을 지키는 기술</div>
    <p class="intro">대기환경 설비의 설계·시공·컨설팅부터<br>운전 데이터 분석·유지보수까지 함께하는 환경엔지니어링 회사</p>
  </section>

  <section class="fields">
    <h2>대기환경 설비</h2>
    <div class="chips"><span>설계</span><span>시공</span><span>컨설팅</span><span>운전 데이터 분석</span><span>유지보수</span></div>
  </section>

  <div class="notice-wrap"><span class="notice">홈페이지 준비중입니다</span></div>

  <section class="contact">
    <p>설비에 관한 고민, 편하게 연락 주십시오</p>
    <div class="lines">
      <a href="mailto:ecorix@ecorix.co.kr">ecorix@ecorix.co.kr</a>
    </div>
  </section>
</main>
<footer>
  에코릭스 | 대표 조명현<br>
  © 2026 에코릭스 ECORIX
</footer>
</body>
</html>
